# viladum.investimenti.cz – statický web (nginx:alpine v kontejneru viladum-web)
# Cloudflare tunnel -> 127.0.0.1:8130 -> tento server.
server {
    listen 80 default_server;
    server_name viladum.investimenti.cz _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Statický web: žádné listování adresářů, žádné skryté soubory
    autoindex off;
    location ~ /\. { deny all; }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Brožura: vynutit stažení s hezkým názvem, povolit resume (Range)
    location = /brozura.pdf {
        types { application/pdf pdf; }
        default_type application/pdf;
        add_header Content-Disposition 'attachment; filename="Viladum-v-zahradach-brozura.pdf"';
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
    }

    location ~* \.(png|svg|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml text/plain;
}
